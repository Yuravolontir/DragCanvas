<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dragcanvas-mark.svg" />
    <!--
      viewport-fit=cover so the layout viewport is the device's full width.
      Without it Safari insets the viewport away from the sensor housing, and
      in landscape that inset comes off the width: window.innerWidth reports a
      number smaller than the phone, which can drop an 874px iPhone under the
      768px threshold that decides between the editor and the read-only
      preview. With cover the breakpoints see the real width and the insets
      become padding this codebase applies - see --safe-left in responsive.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DragCanvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Display face for the landing only. Bricolage has an odd, drawn quality
         that a neutral grotesque does not, which is the point: the headline is
         where the page gets a voice. Two weights, nothing else. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
